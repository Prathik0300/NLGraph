[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "nlgraph"
version = "0.1.0"
description = "Query Decomposition and Multi-Agent Orchestration Core"
requires-python = ">=3.11"
dependencies = [
    # Phrase splitting
    "spacy>=3.7",
    "benepar==0.2.0",

    # Embeddings — bge-m3 hybrid (dense + sparse + colbert)
    "FlagEmbedding>=1.2",
    "sentence-transformers>=3.0",
    "torch>=2.1",
    "transformers>=4.40",

    # Vector DB — global persistent store
    "qdrant-client>=1.9",

    # In-process vector search — blackboard session store
    "faiss-cpu>=1.7",

    # Capability classification learning
    "setfit>=1.0",

    # Schemas and data models
    "pydantic>=2.7",
    "pydantic-settings>=2.3",

    # Database — metadata + performance tracking
    "sqlmodel>=0.0.19",

    # Graph — DAG construction, topological sort
    "networkx>=3.3",

    # Serialization
    "msgpack>=1.0",

    # Numerics
    "numpy>=1.26",

    # LLM execution — Ollama
    "httpx>=0.27",

    # CLI — display layer
    "rich>=13.7",
    "prompt_toolkit>=3.0",

    # Setup tooling
    "tqdm>=4.66",
    "scikit-learn>=1.4",

    # Async
    "anyio>=4.0",
]

[project.scripts]
nlgraph = "cli.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "scipy>=1.13",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["cli*", "core*", "setup*"]
